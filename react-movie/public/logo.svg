<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- 票券兩側的半圓缺口 -->
    <mask id="notch">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="9" cy="32" r="5" fill="#000"/>
      <circle cx="55" cy="32" r="5" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- 電影票 -->
  <rect x="9" y="17" width="46" height="30" rx="5" fill="#fff" mask="url(#notch)"/>
  <!-- 撕票虛線 -->
  <line x1="42" y1="21" x2="42" y2="43" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round"/>
  <!-- 播放鍵 -->
  <path d="M23 25.5 L34 32 L23 38.5 Z" fill="#2563eb" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
</svg>
