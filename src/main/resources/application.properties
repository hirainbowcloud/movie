spring.application.name=movie

spring.datasource.url=jdbc:mysql://localhost:3306/movie_pos
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update  ,  validate  , create-drop
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.upload-dir=D:/wenproject/movie_assets/static

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=150MB 

spring.web.resources.static-locations=classpath:/static/,file:D:/wenproject/movie_assets/static
